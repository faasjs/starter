defaults:
  server:
    root: .
    base: /
  plugins:
    http:
      config:
        cookie:
          secure: false
          session:
            secret: secret
    knex:
      config:
        client: pg
        pool:
          min: 0
          max: 10
development:
  plugins:
    knex:
      config:
        client: pglite
        connection: ./.pglite_dev
testing:
  plugins:
    knex:
      config:
        client: pglite
production:
  plugins:
    knex:
      config:
        client: pg
